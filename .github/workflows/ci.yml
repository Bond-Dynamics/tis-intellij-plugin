name: CI

# BOND-75: the plugin is retired and this repository is archived. The plugin source is gone, so this
# workflow only checks that it stays gone, and still emits the `CI Success` aggregator that branch
# protection requires — see _global/BRANCH_PROTECTION_BASELINE.md in bond-dynamics-docs.

on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retired-check:
    name: Retired check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: The retired plugin source stays removed
        run: |
          set -euo pipefail
          if [ -e path-b-gradle ] || [ -e path-a-textmate ] || [ -e testdata ]; then
            echo "::error::the retired plugin source is back (BOND-75)"
            exit 1
          fi
          if git ls-files | grep -E '\.(kt|kts|tis)$'; then
            echo "::error::source or .tis files are tracked in a retired repository (BOND-75)"
            exit 1
          fi
          if ! grep -q '(retired)' README.md; then
            echo "::error::README.md no longer says the plugin is retired (BOND-75)"
            exit 1
          fi
          echo "Retired repository is clean."

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [retired-check]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Verify all required jobs succeeded
        run: |
          set -euo pipefail
          R="${{ needs.retired-check.result }}"
          echo "retired-check result: $R"
          if [ "$R" != "success" ]; then
            echo "::error::CI Success requires retired-check to succeed (got $R)"
            exit 1
          fi
          echo "All required jobs green."
